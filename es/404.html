<body class="page-404">
    <!-- grain overlay -->
    <div class="grain" aria-hidden="true"></div>

    <!-- interactive canvas background -->
    <canvas id="canvas404" class="canvas-404" aria-hidden="true"></canvas>

    <!-- ══════════ MAIN (FULLSCREEN CENTRED) ══════════ -->
    <main id="main" class="main-404">
        <!-- Ambient lighting glow -->
        <div class="glow-orb glow-violet" aria-hidden="true"></div>
        <div class="glow-orb glow-lime" aria-hidden="true"></div>

        <div class="container-404">
            <!-- "NOTHING TO SEE HERE" above 404 & 404 Display (reduced 30%) -->
            <div class="glitch-display" id="glitchTrigger" role="figure" aria-label="Error 404 — nothing to see here" title="Click para activar glitch">
                <span class="glitch-error" id="glitchError" data-text="NOTHING TO SEE HERE">NOTHING TO SEE HERE</span>
                <span class="glitch-number" id="glitchNumber" data-text="404">404</span>
            </div>

            <!-- Single Action Button: BACK TO WEB -->
            <div class="cta-actions">
                <a href="index.html" class="btn-primary" id="ctaHome">
                    <span class="btn-text">BACK TO WEB</span>
                    <span class="btn-arrow" aria-hidden="true">↗</span>
                </a>
            </div>
            <p class="legal-404"><a href="/cookie-policy.html">Política de cookies</a></p>
        </div>
    </main>

    <!-- LIVE-RELOAD -->
    <script>
    (function () {
        if (!/(localhost|127\.0\.0\.1|e2b\.app)/.test(location.hostname)) return;
        var es = new EventSource("/__livereload");
        var first = true;
        es.onmessage = function () {
            if (first) { first = false; return; }
            location.reload();
        };
    })();
    </script>
    <script src="404.js?v=101" defer></script>
    <script src="/smooth-scroll.js?v=2" defer></script>
</body>
</html>
